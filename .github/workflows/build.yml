name: Rakenna Viesti-Ilmoitin APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Hae koodi
      uses: actions/checkout@v4

    - name: Aseta Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Asenna Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Käännä APK
      run: |
        gradle assembleDebug --stacktrace 2>&1 | tee build.log

    - name: Tallenna valmis APK ladattavaksi
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ViestiIlmoitin-Valmis-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Tallenna loki
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Log
        path: build.log
