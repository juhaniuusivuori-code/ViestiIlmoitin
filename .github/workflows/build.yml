name: Rakenna Viesti-Ilmoitin APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Hae koodi
      uses: actions/checkout@v4

    - name: Aseta Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Luo Gradle Wrapper
      run: gradle wrapper

    - name: Käännä APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Tallenna valmis APK ladattavaksi
      uses: actions/upload-artifact@v4
      with:
        name: ViestiIlmoitin-Valmis-APK
        path: app/build/outputs/apk/debug/app-debug.apk
